# /etc/nginx/conf.d/default.conf — echo-pages server block.
# Serves the pre-built static SPA in /usr/share/nginx/html and falls back
# unmatched requests to /index.html so deep links work.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ALB health check endpoint. Returns 200 trivially so the target group
    # marks the instance healthy fast, independent of the bundle being present.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Long-cache hashed Vite assets (JS/CSS chunks).
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any route not matching a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself — short cache so clients pick up new deploys quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Sensible default headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cap upload body — not used by this static site but defensive.
    client_max_body_size 1m;
}
